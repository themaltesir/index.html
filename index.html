<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recomp43</title>
<meta name="theme-color" content="#07090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recomp43">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#07090d;--card:#10151c;--card2:#161d27;--card3:#1d2632;--line:#222c39;--line2:#303d4f;--txt:#f2f5f9;--dim:#8b97a9;--acc:#38bdf8;--acc2:#0b2536;--accTxt:#03131d;--grad:linear-gradient(135deg,#38bdf8 0%,#2dd4bf 100%);--glow:rgba(56,189,248,.22);--grn:#4ade80;--grn2:#0e2619;--amb:#fbbf24;--red:#f87171;--pink:#f472b6;--pur:#a78bfa;--gold:#fcd34d;--r:18px;--sh:0 8px 24px rgba(0,0,0,.35)}
body.her{--acc:#f472b6;--acc2:#35122a;--accTxt:#2a0718;--grad:linear-gradient(135deg,#f472b6 0%,#c084fc 100%);--glow:rgba(244,114,182,.22)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:15.5px;line-height:1.5;padding-bottom:96px;min-height:100vh;background-image:radial-gradient(1000px 420px at 50% -180px,var(--glow),transparent 70%);background-repeat:no-repeat}
body.insess{padding-bottom:170px}
header{position:sticky;top:0;z-index:30;background:rgba(7,9,13,.86);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.hdrrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:19px;letter-spacing:1.6px;font-weight:900}
header h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:11.5px;margin-top:1px}
.pswitch{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.pswitch button{border:none;background:transparent;color:var(--dim);border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:800;min-height:36px}
.pswitch button.on{background:linear-gradient(135deg,#38bdf8,#2dd4bf);color:#03131d}
.pswitch button.onher{background:linear-gradient(135deg,#f472b6,#c084fc);color:#2a0718}
main{padding:14px 16px 24px;max-width:640px;margin:0 auto}
.card{background:linear-gradient(180deg,var(--card) 0%,#0d1218 100%);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h2{font-size:15px;margin-bottom:8px;color:var(--acc);letter-spacing:.2px}
.card h3{font-size:13.5px;margin:10px 0 5px}
.card p{margin-bottom:8px}
.card p:last-child{margin-bottom:0}
.hero{background:radial-gradient(420px 180px at 100% 0%,var(--glow),transparent 70%),linear-gradient(160deg,var(--acc2) 0%,var(--card) 72%);border-color:var(--line2)}
.donecard{background:radial-gradient(420px 180px at 100% 0%,rgba(74,222,128,.18),transparent 70%),linear-gradient(160deg,#0f2a1c 0%,var(--card) 75%);border-color:rgba(74,222,128,.45)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc)}
.big{font-size:24px;font-weight:900;letter-spacing:-.4px;line-height:1.15;margin:4px 0 8px}
.mchips{display:flex;flex-wrap:wrap;gap:5px}
.mchips span{font-size:11.5px;font-weight:700;color:var(--txt);background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:999px;padding:3px 9px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:rgba(255,255,255,.05);border-radius:13px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:21px;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--dim)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
.dim{color:var(--dim);font-size:12.5px}
.small{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
th{color:var(--dim);text-align:left;font-weight:600;padding:5px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;margin:3px 5px 3px 0;min-height:32px;line-height:1.3;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accTxt);border-color:var(--acc);font-weight:800}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--grad);color:var(--accTxt);border:none;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:800;width:100%;min-height:52px;box-shadow:0 8px 22px var(--glow),0 2px 6px rgba(0,0,0,.4);letter-spacing:.2px}
.btn:active,.btn2:active,.tick:active,.iconbtn:active{transform:scale(.97)}
.btn.pinkbg{background:linear-gradient(135deg,#f472b6,#c084fc);color:#2a0718}
.btn.grn{background:linear-gradient(135deg,#4ade80,#2dd4bf);color:#052e16}
.btn2{background:var(--card3);color:var(--txt);border:1px solid var(--line2);border-radius:12px;padding:10px 13px;font-size:13.5px;font-weight:600;min-height:42px}
.btn3{background:none;border:none;color:var(--red);font-size:17px;padding:2px 8px}
.linkbtn{background:none;border:none;color:var(--acc);font-size:12.5px;font-weight:700;padding:2px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(7,9,13,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;padding:5px 6px calc(5px + env(safe-area-inset-bottom));z-index:20;gap:3px}
nav button{flex:1;background:none;border:none;color:var(--dim);font-size:10.5px;font-weight:600;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;min-height:50px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--acc);background:var(--acc2)}
.sessbar{position:fixed;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom));z-index:19;padding:9px 14px;background:rgba(10,13,18,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
.sessbar .meta{flex:1;min-width:0;font-size:13px}
.sessbar .pbar{height:6px;background:var(--card3);border-radius:4px;overflow:hidden;margin-top:5px}
.sessbar .pbar i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}
.sessbar .btn{width:auto;padding:10px 18px;min-height:46px;font-size:15px;flex:none}
.ex{background:var(--card2);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px;transition:border-color .3s;scroll-margin-top:150px}
.ex.complete{border-color:rgba(74,222,128,.5)}
.exhd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exbtns{display:flex;gap:6px;flex:none}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card3);border:1px solid var(--line2);color:var(--txt);font-size:16px;display:flex;align-items:center;justify-content:center}
.ex .name{font-weight:800;font-size:16.5px;margin-top:5px;letter-spacing:-.1px;line-height:1.25}
.ex .scheme{color:var(--grn);font-size:12.5px;margin:4px 0 2px;font-weight:600}
.ex .cue{color:var(--dim);font-size:12px}
.sugg{color:#c4b5fd;font-size:13px;margin-top:8px;font-weight:700;background:rgba(167,139,250,.12);border-radius:9px;padding:6px 9px;display:inline-block}
.last{color:var(--dim);font-size:11.5px;margin-top:4px}
.part{font-size:13.5px;font-weight:800;margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.part .pl{background:var(--card3);border:1px solid var(--line2);border-radius:7px;font-size:11px;padding:1px 7px;color:var(--acc)}
.info{margin-top:10px;padding:11px 12px;background:var(--card3);border:1px solid var(--line);border-radius:13px;font-size:13px}
.info p{margin-bottom:6px}
.sets{margin-top:8px}
.sethd,.setrow{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center}
.sethd{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:700;padding:2px 0}
.sethd span{text-align:center}
.setrow{margin:6px 0}
.setrow .sn{color:var(--dim);font-size:13px;font-weight:800;text-align:center}
.setrow input{text-align:center;padding:8px 4px;font-size:17px;font-weight:800;min-height:46px;font-variant-numeric:tabular-nums;transition:all .2s}
.setrow input::placeholder{color:#5d6b80;font-weight:700}
.setrow.done input{border-color:rgba(74,222,128,.55);background:var(--grn2);color:#dcfce7}
.tick{width:48px;height:46px;border-radius:13px;border:1.5px solid var(--line2);background:var(--card3);color:#5d6b80;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tick.on{background:var(--grn);border-color:var(--grn);color:#052e16;box-shadow:0 0 0 4px rgba(74,222,128,.16)}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{background:var(--card3);color:var(--txt);border:1px solid var(--line2);border-radius:11px;padding:10px;font-size:16px;width:100%;min-height:42px;font-family:inherit}
select{width:auto;font-size:14px;padding:8px 10px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
label{font-size:11.5px;color:var(--dim);display:block;margin:8px 0 4px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.7px;padding:3px 8px;border-radius:6px;text-transform:uppercase;display:inline-block}
.tag.main{background:#0f3550;color:#7dd3fc}
.tag.acc{background:#11301f;color:var(--grn)}
.tag.ss{background:#3a2c0f;color:var(--amb)}
.tag.iso{background:#3a1a2c;color:#f9a8d4}
.tag.core{background:#0d3330;color:#5eead4}
.tag.pwr{background:#3b300a;color:var(--gold)}
.banner{border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:13px;border:1px solid}
.banner.g{background:#0f2418;border-color:#1f4a33;color:var(--grn)}
.banner.a{background:#2a210d;border-color:#4d3d17;color:var(--amb)}
.banner.r{background:#2a1313;border-color:#4d2424;color:var(--red)}
.banner.n{background:#141b26;border-color:#283850;color:var(--dim)}
.timer{position:absolute;left:12px;right:12px;top:calc(100% + 6px);display:flex;align-items:center;gap:8px;background:var(--grad);color:var(--accTxt);border-radius:999px;padding:5px 6px 5px 14px;font-weight:900;font-variant-numeric:tabular-nums;box-shadow:0 6px 18px var(--glow)}
.timer .tlab{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.timer .tbar{flex:1;height:6px;background:rgba(0,0,0,.22);border-radius:3px;overflow:hidden}
.timer .tbar i{display:block;height:100%;width:100%;background:rgba(255,255,255,.85);border-radius:3px;transition:width .25s linear}
.timer span{font-size:20px;min-width:52px;text-align:right;cursor:pointer}
.timer button{background:rgba(0,0,0,.22);border:none;color:var(--accTxt);font-weight:800;font-size:12.5px;border-radius:999px;padding:7px 11px;min-height:34px}
.timer.go{background:linear-gradient(135deg,#4ade80,#2dd4bf);color:#052e16}
.toast{position:fixed;left:50%;top:calc(128px + env(safe-area-inset-top));transform:translate(-50%,-16px);opacity:0;background:#4ade80;color:#052e16;font-weight:800;padding:11px 18px;border-radius:999px;z-index:60;box-shadow:0 12px 32px rgba(0,0,0,.55);transition:all .25s;pointer-events:none;font-size:14px;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
input[type=date],input[type=time]{min-width:0;max-width:100%}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
details{margin-bottom:6px}
details.card{padding:6px 16px}
details.card[open]{padding-bottom:14px}
summary{cursor:pointer;font-weight:700;font-size:14px;padding:10px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:'›';color:var(--acc);font-size:22px;line-height:1;transform:rotate(90deg);transition:transform .15s;flex:none}
details[open]>summary::after{transform:rotate(-90deg)}
.hide{display:none!important}
ul,ol{padding-left:18px;margin-bottom:8px}
li{margin-bottom:4px}
.kpi{background:var(--card2);border-radius:12px;padding:10px 6px;text-align:center}
.kpi .v{font-size:17px;font-weight:800;color:var(--acc)}
.kpi .v.over{color:var(--red)}
.kpi .v.good{color:var(--grn)}
.kpi .k{font-size:10.5px;color:var(--dim)}
.bar{height:8px;background:var(--card3);border-radius:5px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:5px}
.bar i.over{background:var(--red)}
.ring{text-align:center}
.ring svg{width:100%;max-width:80px;height:auto}
.ring .rv{font-size:13px;font-weight:800;fill:var(--txt)}
.ring .rk{font-size:10.5px;color:var(--dim);line-height:1.25;margin-top:2px}
.fresult{padding:10px 6px;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;cursor:pointer;min-height:44px;align-items:center}
.fresult .m{color:var(--dim);font-size:11.5px}
.fentry{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl{border-left:2px solid var(--line2);padding-left:12px;margin-left:4px}
.tl div{margin-bottom:8px;font-size:13px}
.tl b{color:var(--acc);font-size:12.5px}
hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.wk .d{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px 0 6px;font-size:11.5px;font-weight:700;color:var(--dim)}
.wk .d.today{border-color:var(--acc);color:var(--txt);box-shadow:0 0 0 2px var(--acc2)}
.wk .d.fut{opacity:.55}
.wk .dots{display:flex;justify-content:center;gap:3px;margin-top:4px;height:8px}
.wk .dots i{width:8px;height:8px;border-radius:50%;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.vol{display:grid;grid-template-columns:84px 1fr 46px;gap:8px;align-items:center;font-size:12.5px;margin:7px 0}
.vol .trk{position:relative;height:11px;background:var(--card3);border-radius:6px;overflow:hidden}
.vol .zone{position:absolute;top:0;bottom:0;background:rgba(74,222,128,.12);border-left:1px dashed rgba(74,222,128,.55);border-right:1px dashed rgba(74,222,128,.55)}
.vol .plan{position:absolute;top:3px;bottom:3px;left:0;background:rgba(148,163,184,.32);border-radius:4px}
.vol .dn{position:absolute;top:0;bottom:0;left:0;background:var(--grad);border-radius:6px}
.qlist .qi{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.qlist .qi:last-child{border-bottom:none}
.qn{font-size:11px;font-weight:800;color:var(--dim);width:18px}
.sesscard{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.badge{font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--acc);color:var(--accTxt);letter-spacing:.3px}
.presc{display:flex;flex-direction:column;gap:2px;margin-top:8px;background:rgba(56,189,248,.08);border:1px solid var(--line2);border-radius:12px;padding:8px 11px}
body.her .presc{background:rgba(244,114,182,.08)}
.presc b{font-size:17px;font-weight:900;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.presc span{font-size:12px;color:var(--dim)}
.presc .pl1{display:flex;align-items:center;gap:8px}
.presc .pl1 b{flex:1}
.presc .stp{display:flex;gap:4px;flex:none}
.presc .stp button{width:34px;height:32px;border-radius:9px;border:1px solid var(--line2);background:var(--card3);color:var(--txt);font-size:17px;font-weight:800;line-height:1}
.presc .ctx{font-size:12.5px;color:var(--txt);opacity:.85}
.presc .ctx em{font-style:normal;color:var(--amb);font-weight:700}
.presc .ctx u{text-decoration:none;color:var(--grn);font-weight:700}
.ex.complete .presc,.ex.complete .sets,.ex.complete .last,.ex.complete .info,.ex.complete .part{display:none}
.ex.complete.open .presc,.ex.complete.open .sets,.ex.complete.open .last,.ex.complete.open .part{display:block}
.ex.complete.open .presc{display:flex}
.ex.complete.open .part{display:flex}
.ex.complete.open .donesum{display:block}
.ex .donesum .ds2{display:none}
.ex.complete.open .donesum .ds1{display:none}
.ex.complete.open .donesum .ds2{display:inline}
.ex.complete.open .info:not(.hide){display:block}
.ex .donesum{display:none;margin-top:6px;font-size:13px;color:var(--grn);font-weight:700;cursor:pointer}
.ex.complete .donesum{display:block}
.ex.complete.open .donesum{display:none}
.ex.complete{padding:12px 14px;opacity:.92}
.mini{display:flex;align-items:flex-end;gap:2px;height:22px;width:120px;margin-top:4px}
.mini i{flex:1;background:var(--acc);opacity:.7;border-radius:2px;display:block}
.ex .exnote{display:inline-block;margin-top:5px;font-size:12px;color:var(--amb);background:rgba(251,191,36,.1);border-radius:7px;padding:2px 8px}
.adj{font-size:12px;color:var(--amb);font-weight:700;min-height:0;margin-top:2px}
.adj:empty{display:none}
.setrow.drill{grid-template-columns:30px 1fr 48px}
.setrow.drill .dl{font-size:14px;font-weight:700;color:var(--dim)}
.setrow.drill.done .dl{color:var(--grn)}
.warm{margin-top:10px;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:10px 12px;font-size:13px}
.warm ol{margin:4px 0 0;padding-left:18px}
.warm li{margin-bottom:3px}
.coach .ci{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.coach .ci:first-of-type{border-top:none}
.coach .cic{font-size:18px;width:24px;text-align:center;flex:none}
.btn2.sm{padding:6px 10px;min-height:34px;font-size:12.5px;flex:none}
.habs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.hab{background:var(--card2);border:1px solid var(--line2);border-radius:13px;padding:9px 4px;color:var(--dim);font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px;text-align:center}
.hab .hi{font-size:20px;filter:grayscale(1);opacity:.6}
.hab.on{background:var(--grn2);border-color:rgba(74,222,128,.55);color:#dcfce7}
.hab.on .hi{filter:none;opacity:1}
.hab:disabled{cursor:default}
.wk .hs{font-size:13px;color:var(--txt);font-weight:800;margin-top:2px}
.bench{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.bench:first-of-type{border-top:none}
.lvl{font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;text-transform:uppercase;letter-spacing:.5px}
.lvl.great{background:var(--grn2);color:var(--grn)}
.lvl.good{background:#0f3550;color:#7dd3fc}
.lvl.build{background:#2a210d;color:var(--amb)}
details.howto{margin:2px 0 0}
details.howto summary{padding:3px 0;font-weight:600}
details.howto summary::after{font-size:16px}

 dbStep:2,mcStep:2.5,warm:'5 min uphill walk — 15% incline at 4 km/h',warmHer:'5 min uphill walk — 15% incline at 4 km/h'};

 const c=cfg();if(c.start)return;
 const h=S.get('hist',[]).concat(S.get('her_hist',[])).map(x=>x.d).sort();
 const d=new Date((h[0]||todayKey())+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7));
 c.start=todayKey(d);S.set('cfg',c);S.set('autoStart',c.start);

/* ============ TIME OFF — holidays, sickness, busy weeks ============
   {id,from,to,type:'holiday'|'sick'|'busy',who:'both'|'me'|'her',gym:bool}
   Shared ('both') time off pauses the programme clock, so blocks resume where they stopped. */
const OFFTYPES={holiday:{ic:'✈️',n:'Holiday'},sick:{ic:'🤒',n:'Ill'},busy:{ic:'💼',n:'Busy / work trip'}};
function offList(){return S.get('off',[])}
function offOn(dk,pfx){const w=(pfx??P())==='her_'?'her':'me',m=offList().filter(o=>dk>=o.from&&dk<=o.to&&(o.who==='both'||o.who===w));return m.find(o=>o.type==='sick')||m.find(o=>o.who!=='both')||m[0]||null}
function offNext(pfx,within){const w=(pfx??P())==='her_'?'her':'me',tk=todayKey();return offList().filter(o=>o.from>tk&&daysBetween(tk,o.from)<=(within||14)&&(o.who==='both'||o.who===w)).sort((a,b)=>a.from<b.from?-1:1)[0]||null}
function offDaySet(){return memo('offset',()=>{const s=new Set();offList().filter(o=>o.who==='both').forEach(o=>{let d=o.from,g=0;while(d<=o.to&&g++<400){s.add(d);d=addDays(d,1)}});return s})}
function pausedDays(from,to){let n=0;offDaySet().forEach(d=>{if(d>=from&&d<to)n++});return n}
function progDays(dk){const c=cfg();if(!c.start)return 0;dk=dk||todayKey();return Math.max(0,daysBetween(c.start,dk)-pausedDays(c.start,dk))}

 return memo('pdo'+idx,()=>{const c=cfg();if(!c.start)return todayKey();const off=offDaySet();let d=c.start,n=0,g=0;while(n<idx&&g++<5000){if(!off.has(d))n++;d=addDays(d,1)}return d});
}

function weekDates(){const now=new Date(todayKey()+'T12:00'),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return todayKey(d)})}
function weekBudget(){
 const ds=weekDates(),tk=todayKey(),f=flog();
 let budget=0,used=0,usedAlc=0,toDate=0,missing=0;
 ds.forEach(dk=>{const day=f[dk]||{type:defType(dk),items:[]},t=targets(day.type).kcal;budget+=t;
  if(dk<=tk){toDate+=t;used+=day.items.reduce((a,it)=>a+(it.k||0),0);usedAlc+=day.items.filter(it=>it.a).reduce((a,it)=>a+(it.k||0),0);if(dk<tk&&!day.items.length)missing++}});
 const daysLeft=ds.filter(d=>d>tk).length;
 return{budget,used,usedAlc,toDate,missing,daysLeft,remaining:budget-used,perDay:daysLeft?Math.round((budget-used)/daysLeft):0};
}
/* ---- Progress check: 7-day average vs 2–4 weeks ago ---- */
function trendDelta(key){
 const m=metrics(),now=new Date(todayKey()+'T12:00');
 const pts=Object.keys(m).filter(d=>m[d][key]!=null).map(d=>[(now-new Date(d+'T12:00'))/864e5,m[d][key]]);
 const rec=pts.filter(p=>p[0]>=0&&p[0]<=7).map(p=>p[1]),old=pts.filter(p=>p[0]>=14&&p[0]<=28).map(p=>p[1]);
 if(!rec.length||!old.length)return null;
 const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
 return Math.round((avg(rec)-avg(old))*10)/10;
}

  <h3>🔁 Swaps — same life, fewer calories</h3><table>${SWAPS.map(x=>`<tr><td>${x[0]}</td><td>→ ${x[1]}</td><td style="color:var(--grn);white-space:nowrap">${x[2]}</td></tr>`).join('')}</table>
  <h3>Daily targets — ${WHO()}</h3>${essentialsTable()}
  ${c.hot?HOTCARD:''}</details>`;
}
function bellyCard(){
 const tk=todayKey(),h=prof==='her'?(+cfg().htHer||165):(+cfg().ht||180),lw=lastMetric('waist'),fd=foodDate,auto=habAuto(fd),man=habDay(fd);
 return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2 style="margin:0">🎯 Belly habits</h2><span class="dim small">${lw?`waist ${lw.v} cm · goal < ${Math.round(h/2)}`:''}</span></div>
 <div class="habs">${HABITS.map(([k,ic,n])=>{const a=auto[k],on=a||man[k];return `<button class="hab${on?' on':''}" ${a?'disabled':''} onclick="togHab('${k}','${fd}')"><span class="hi">${ic}</span><span>${k==='steps'?(stepGoal()/1000)+'k steps':n}</span></button>`}).join('')}</div>
 <div class="wk" style="margin-top:10px">${weekDates().map(d=>`<div class="d${d===tk?' today':''}${d>tk?' fut':''}">${dayName(d)}<div class="hs">${d>tk?'·':habScore(d)}</div></div>`).join('')}</div>
 <p class="dim small" style="margin-top:8px">5–6 a day = fat-loss day. Protein ticks itself from your food log.</p></div>`;

/* ---- BODY ---- */
function saveBench(k,v){const b=benchAll(),tk=todayKey();b[k]=(b[k]||[]).filter(x=>x.d!==tk);if(v!==''&&!isNaN(parseFloat(v)))b[k].unshift({d:tk,v:parseFloat(v)});S.set(P()+'bench',b);MEMO={}}
function benchCard(){
 const b=benchAll(),her=prof==='her'?1:0,tk=todayKey(),lb=benchLast();
 const rows=BENCH.map(t=>{
  const arr=(b[t.k]||[]).slice();arr.sort((x,y)=>x.d<y.d?1:-1);
  const last=arr[0],prev=arr[1],g=t.g[her],ch=last&&prev?Math.round((last.v-prev.v)*10)/10:null,better=ch==null?null:(t.hi?ch>0:ch<0);
  const lvl=!last?'':t.hi?(last.v>=g[1]?'great':last.v>=g[0]?'good':'build'):(last.v<=g[1]?'great':last.v<=g[0]?'good':'build');
  const todayV=(b[t.k]||[]).find(x=>x.d===tk);
  return `<div class="bench"><div style="flex:1;min-width:0"><b class="small">${t.n}</b>${lvl?` <span class="lvl ${lvl}">${{great:'great',good:'solid',build:'build it'}[lvl]}</span>`:''}
   <div class="dim small">${last?`${last.v}${t.u&&t.u!=='/10'?' '+t.u:t.u} · ${fmtD(last.d)}${ch!=null&&ch!==0?` · <span style="color:${better?'var(--grn)':'var(--amb)'}">${ch>0?'+':''}${ch}</span>`:''}`:'not tested yet'} · guide: ${t.hi?'':'≤'}${g[0]} solid, ${t.hi?'':'≤'}${g[1]} great</div>
   <details class="howto"><summary class="small dim">How to test · why it matters</summary><p class="small">${t.how}</p><p class="dim small">${t.why}</p></details></div>
   <input type="number" inputmode="decimal" style="width:82px;flex:none" placeholder="${t.u||'value'}" value="${todayV?todayV.v:''}" onchange="saveBench('${t.k}',this.value);render()"></div>`;
 }).join('');
 return `<details class="card" style="display:block"><summary>🏅 Athlete check · last: ${lb?fmtD(lb):'never'}</summary><p class="dim small">Every 6 weeks — power, engine, grip and balance, not just muscle.</p>${rows}</details>`;
}
function spark(key,label){
 const m=metrics();const ks=Object.keys(m).filter(d=>m[d][key]!=null).sort().slice(-14);
 if(ks.length<2)return'';
 const vs=ks.map(d=>m[d][key]);const mn=Math.min(...vs),mx=Math.max(...vs);
 const dir=vs[vs.length-1]-vs[0];
 return `<h3>${label} <span class="dim small">${vs[0]} → ${vs[vs.length-1]} (${dir>0?'+':''}${Math.round(dir*10)/10})</span></h3>
 <div style="display:flex;align-items:flex-end;gap:2px;height:34px;margin:3px 0 8px">${vs.map(v=>`<div style="flex:1;background:var(--acc);opacity:.75;border-radius:2px;height:${mx===mn?55:Math.round(18+82*(v-mn)/(mx-mn))}%"></div>`).join('')}</div>`;
}
function dataView(){
 const dk=todayKey(),m=metrics(),tm=m[dk]||{},her=prof==='her';
 const days=Object.keys(m).filter(d=>m[d].wt!=null||m[d].waist!=null).sort().reverse().slice(0,12);
 const sp=spark('wt','Weight')+spark('waist','Waist');
 return `<div class="card"><h2>Weigh-in & waist — ${WHO()}</h2>
  <div class="grid2"><div><label>Weight kg (Mon & Thu)</label><input type="number" inputmode="decimal" placeholder="${her?'64.0':'86.0'}" value="${tm.wt??''}" oninput="saveMetric('${dk}','wt',this.value)" onchange="render()"></div>
  <div><label>Waist cm (weekly)</label><input type="number" inputmode="decimal" placeholder="${her?'78':'92'}" value="${tm.waist??''}" oninput="saveMetric('${dk}','waist',this.value)" onchange="render()"></div></div>
  ${whtr()}</div>
 ${progressCard()}
 ${sp?`<div class="card">${sp}</div>`:''}
 ${benchCard()}
 ${days.length?`<details class="card" style="display:block"><summary>History</summary><table><tr><th>Date</th><th>Weight</th><th>Waist</th></tr>${days.map(d=>`<tr><td>${fmtD(d)}</td><td>${m[d].wt??''}</td><td>${m[d].waist??''}</td></tr>`).join('')}</table></details>`:''}`;
}

/* ---- MORE ---- */
/* Put the programme at a given cycle/week: the start date is worked out for you (time off included) */
function setProgWeek(cy,wk){
 cy=Math.max(1,Math.min(9,+cy||1));wk=Math.max(1,Math.min(12,+wk||1));
 const tk=todayKey(),mon=addDays(tk,-((new Date(tk+'T12:00').getDay()+6)%7)),c=cfg();
 c.start=addDays(mon,-((cy-1)*84+(wk-1)*7));S.set('cfg',c);MEMO={};
 for(let i=0;i<12;i++){const diff=((cycleNum()-1)*12+weekNum())-((cy-1)*12+wk);if(!diff)break;c.start=addDays(c.start,diff*7);S.set('cfg',c);MEMO={}}
 S.set('autoStart','');toast('✓ Cycle '+cycleNum()+' · Week '+weekNum()+' — '+BLOCKS[curBlock()].name.split(' · ')[1]+' block');render();
}
function setProgStart(d){if(!d){toast('Pick a date first');return}const c=cfg();c.start=d;S.set('cfg',c);MEMO={};S.set('autoStart','');toast('✓ Cycle '+cycleNum()+' · Week '+weekNum());render()}
function progCard(){
 const c=cfg(),cy=cycleNum(),wk=weekNum();
 return `<div class="card"><h2>Your programme</h2>
 <p class="small">Cycle <b>${cy}</b> · Week <b>${wk}</b> of 12 · ${BLOCKS[curBlock()].name.split(' · ')[1]} block${isConsol()?' (light week)':''}</p>
 <div class="grid2"><div><label>Cycle</label><select id="pgC" style="width:100%">${[1,2,3,4,5,6].map(n=>`<option ${n===cy?'selected':''}>${n}</option>`).join('')}</select></div>
 <div><label>Week</label><select id="pgW" style="width:100%">${Array.from({length:12},(_,i)=>i+1).map(n=>`<option ${n===wk?'selected':''}>${n}</option>`).join('')}</select></div></div>
 <button class="btn2" style="width:100%;margin-top:8px" onclick="setProgWeek(el('pgC').value,el('pgW').value)">Set my week</button>
 <details style="margin-top:8px"><summary class="small dim">Or pick the date you started</summary>
  <input type="date" id="pgD" value="${c.start}"><button class="btn2" style="width:100%;margin-top:8px" onclick="setProgStart(el('pgD').value)">Use this start date</button></details>
 <p class="dim small" style="margin-top:6px">Weeks 1–4 Foundation · 5–8 Strength · 9–12 Definition, then a new cycle with fresh exercises. Your logged weights carry over whichever week you pick.</p></div>`;
}
let offDraft={type:'holiday',who:'both',gym:true,from:'',to:''};
function setDraft(k,v){offDraft[k]=v;render()}
function addOff(){
 const d=offDraft;if(!d.from||!d.to){toast('Pick both dates');return}
 if(d.to<d.from){toast('The end date is before the start');return}
 const l=offList();l.push({id:Date.now(),from:d.from,to:d.to,type:d.type,who:d.who,gym:d.type==='holiday'?!!d.gym:false});
 l.sort((a,b)=>a.from<b.from?-1:1);S.set('off',l);
 offDraft={type:'holiday',who:'both',gym:true,from:'',to:''};MEMO={};toast('✓ Time off added — the plan will adjust');render();
}
function delOff(id){if(!confirm('Remove this time off?'))return;S.set('off',offList().filter(o=>o.id!==id));MEMO={};render()}
function offCard(){
 const l=offList(),tk=todayKey(),who={both:'Both of us',me:'Brian',her:'Clare'};
 return `<div class="card" id="offCard"><h2>🧳 Time off & holidays</h2>
 <p class="dim small">The plan pauses while you’re away and eases you back in.</p>
 ${l.length?l.map(o=>`<div class="fentry"><span class="small">${OFFTYPES[o.type].ic} ${fmtD(o.from)} → ${fmtD(o.to)} · ${who[o.who]}${o.type==='holiday'?(o.gym?' · hotel gym':' · no gym'):''}${o.to<tk?' <span class="dim">(past)</span>':o.from<=tk?' <b style="color:var(--amb)">now</b>':''}</span><button class="btn3" aria-label="Remove" onclick="delOff(${o.id})">×</button></div>`).join(''):'<p class="dim small">Nothing planned.</p>'}
 <h3>Add time off</h3>
 <div>${Object.keys(OFFTYPES).map(k=>`<span class="chip ${offDraft.type===k?'on':''}" onclick="setDraft('type','${k}')">${OFFTYPES[k].ic} ${OFFTYPES[k].n}</span>`).join('')}</div>
 <div class="grid2" style="margin-top:6px"><div><label>First day off</label><input type="date" value="${offDraft.from}" onchange="offDraft.from=this.value"></div><div><label>Last day off</label><input type="date" value="${offDraft.to}" onchange="offDraft.to=this.value"></div></div>
 <label>Who</label>${['both','me','her'].map(k=>`<span class="chip ${offDraft.who===k?'on':''}" onclick="setDraft('who','${k}')">${who[k]}</span>`).join('')}
 ${offDraft.type==='holiday'?`<label>Gym where you’re going?</label><span class="chip ${offDraft.gym?'on':''}" onclick="setDraft('gym',true)">Yes — hotel gym</span><span class="chip ${!offDraft.gym?'on':''}" onclick="setDraft('gym',false)">No gym</span>`:''}
 <div style="margin-top:10px"><button class="btn2" onclick="addOff()">+ Add time off</button></div></div>`;
}
function backupText(){
 const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('r43_'))out[k]=localStorage.getItem(k)}
 return JSON.stringify(out);
}
function backupFile(){
 const t=backupText(),name='recomp43-backup-'+todayKey()+'.json';S.set('lastBk',todayKey());
 try{if(typeof File!=='undefined'){const f=new File([t],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Recomp43 backup'}).catch(()=>{});return}}}catch(e){}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast('Backup saved')}catch(e){copyText(t)}
}
function restoreText(t){
 let o;try{o=JSON.parse(t)}catch(e){toast('That isn’t a Recomp43 backup');return}
 const ks=Object.keys(o||{}).filter(k=>k.startsWith('r43_'));if(!ks.length){toast('That isn’t a Recomp43 backup');return}
 if(!confirm('Replace the data on this phone with this backup?'))return;
 ks.forEach(k=>localStorage.setItem(k,o[k]));toast('Restored ✓');setTimeout(()=>location.reload(),700);
}
function restoreFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restoreText(String(r.result));r.readAsText(f);inp.value=''}
function doBackup(){el('bkBox').value=backupText();el('bkBox').select();S.set('lastBk',todayKey());try{document.execCommand('copy');toast('Copied — paste it into Notes')}catch(e){toast('Select all and copy')}}
function doRestore(){restoreText(el('bkBox').value)}
function moreView(){
 const c=cfg(),chips=(k,opts)=>opts.map(([v,l])=>`<span class="chip ${String(c[k])===String(v)?'on':''}" onclick="setCfg('${k}',${typeof v==='number'?v:`'${v}'`})">${l}</span>`).join('');
 const lb=S.get('lastBk','');
 return `
 ${progCard()}
 ${offCard()}
 <div class="card"><h2>Backup</h2>
  <p class="dim small">Your data lives only in this copy of the app on this phone — the Home Screen app, Safari and Chrome each keep their own. Use one and back it up every week or two${lb?` — last: ${fmtD(lb)}`:''}.</p>
  <div class="row"><button class="btn2" onclick="backupFile()">💾 Save backup file</button><label class="btn2 filebtn">📂 Restore from file<input type="file" accept=".json,application/json,text/plain" onchange="restoreFile(this)"></label></div>
  <details style="margin-top:6px"><summary class="small dim">Copy / paste instead</summary><textarea id="bkBox" rows="3" placeholder="Backup text appears / paste here"></textarea>
  <div class="row" style="margin-top:7px"><button class="btn2" onclick="doBackup()">Copy</button><button class="btn2" onclick="doRestore()">Restore pasted text</button></div></details></div>
 <details class="card" style="display:block"><summary>Settings</summary>
  <div class="grid2"><div><label>Brian weight (kg)</label><input type="number" value="${c.wt}" onchange="setCfg('wt',parseFloat(this.value)||86)"></div>
  <div><label>Clare weight (kg)</label><input type="number" value="${c.wtHer}" onchange="setCfg('wtHer',parseFloat(this.value)||64)"></div></div>
  <div class="grid2"><div><label>Brian height (cm)</label><input type="number" value="${c.ht}" onchange="setCfg('ht',parseFloat(this.value)||180)"></div>
  <div><label>Clare height (cm)</label><input type="number" value="${c.htHer}" onchange="setCfg('htHer',parseFloat(this.value)||165)"></div></div>
  <div class="grid2"><div><label>Brian age</label><input type="number" value="${c.age}" onchange="setCfg('age',parseFloat(this.value)||43)"></div>
  <div><label>Clare age</label><input type="number" value="${c.ageHer}" onchange="setCfg('ageHer',parseFloat(this.value)||43)"></div></div>
  <label>Goal — ${WHO()}</label>${Object.keys(MODES).map(k=>`<span class="chip ${myMode()===k?'on':''}" onclick="setCfg('${prof==='her'?'modeHer':'mode'}','${k}')">${MODES[k].n}</span>`).join('')}
  <label>Dumbbells at your gym go up in</label>${chips('dbStep',[[2,'2 kg'],[2.5,'2.5 kg']])}
  <label>Machine & cable stacks go up in</label>${chips('mcStep',[[2.5,'2.5 kg'],[5,'5 kg']])}
  <label>Warm-up — Brian</label><input type="text" value="${esc(c.warm)}" onchange="setCfg('warm',this.value)">
  <label>Warm-up — Clare</label><input type="text" value="${esc(c.warmHer)}" onchange="setCfg('warmHer',this.value)">
  <label>Exercise variety</label>${chips('variety',[['low','Same lifts all block'],['med','Swap every 2 visits'],['high','New every visit']])}
  <label>Paired exercises</label>${chips('ssMode',[['pair','Back-to-back'],['straight','Straight sets (busy gym)']])}
  <p class="dim small" style="margin-top:8px">v${VERSION}</p></details>
 ${EDGE}
 <details class="card" style="display:block"><summary>Reset</summary><button class="btn2" style="color:var(--red)" onclick="if(confirm('Erase ALL data on this phone (both profiles)? Save a backup file first.')){localStorage.clear();location.reload()}">Erase all data</button></details>`;
}
/* ---- TIMER (auto-starts after each ticked set) ---- */
let tInt=null,tEnd=0,tTot=1,tHide=null,aCtx=null;
function unlockAudio(){try{if(!aCtx)aCtx=new (window.AudioContext||window.webkitAudioContext)();if(aCtx.state==='suspended')aCtx.resume()}catch(e){}}
function tTick(){
 const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
 el('timerBox').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 const f=el('timerFill');if(f)f.style.width=Math.max(0,Math.min(100,100*left/tTot))+'%';
 if(left<=0){clearInterval(tInt);el('timerBox').textContent='GO';el('timer').classList.add('go');beep();tHide=setTimeout(()=>el('timer').classList.add('hide'),3500)}
}
function startTimer(sec){clearInterval(tInt);clearTimeout(tHide);el('timer').classList.remove('hide','go');tTot=Math.max(1,sec);tEnd=Date.now()+sec*1000;tTick();tInt=setInterval(tTick,250)}
function addTime(s){const left=Math.max(0,tEnd-Date.now()),tot=tTot;startTimer(Math.round(left/1000)+s);tTot=tot+s}
function stopTimer(){clearInterval(tInt);clearTimeout(tHide);const t=el('timer');if(t)t.classList.add('hide')}
function beep(){
 try{unlockAudio();const c=aCtx;if(c)[0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.3,c.currentTime+t);o.start(c.currentTime+t);o.stop(c.currentTime+t+.16)})}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
/* Keep the screen awake during a workout (Safari 16.4+) */
let wakeLock=null;
async function holdWake(){try{if(navigator.wakeLock&&!wakeLock&&!document.hidden){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}
function releaseWake(){try{if(wakeLock)wakeLock.release()}catch(e){}wakeLock=null}

/* Old Shortcut links (?rhr=…) are ignored — just tidy the address bar */
try{if(location.search&&location.search.length>1)history.replaceState(null,'',location.pathname)}catch(e){}

/* Ask iOS/browser to protect localStorage from eviction */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
/* Stale-tab guard: any old Safari tab re-reads storage the moment it's viewed again */
try{
 window.addEventListener('pageshow',()=>render());
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
 window.addEventListener('storage',()=>render());
}catch(e){}

/* Reopen today's workout after Safari reloads the page (common on iPhone after switching apps) */
try{const o=S.get('open',null);if(o&&o.d===todayKey()&&tab==='train'&&!openSession){openSession=o.id;if(o.p)prof=o.p}}catch(e){}
/* ---- ROOT ---- */
let lastView='',lastDay=todayKey();
function dKey(d){const s=d.querySelector('summary');return s?s.textContent.trim().slice(0,18):''}
function render(){
 MEMO={};{const tk=todayKey();if(tk!==lastDay){if(foodDate===lastDay)foodDate=tk;lastDay=tk}}ensureStart();autoComplete('');autoComplete('her_');MEMO={};
 try{document.body.classList.toggle('her',prof==='her')}catch(e){}
 nav();pswitch();
 el('hdrSub2').textContent='Wk '+weekNum()+'/12 · '+BLOCKS[curBlock()].name.split(' · ')[1]+' block'+(isConsol()?' (light week)':'')+' · '+MODES[myMode()].n;
 const views={today:todayView,train:trainView,home:homeView,food:foodView,data:dataView,more:moreView};
 const vk=tab+'|'+(openSession||'')+'|'+prof,keep=new Set(),openEx=new Set();
 if(vk===lastView&&el('main').querySelectorAll){el('main').querySelectorAll('details[open]').forEach(d=>keep.add(dKey(d)));el('main').querySelectorAll('.ex.open').forEach(e=>openEx.add(e.id))}
 el('main').innerHTML=(views[tab]||todayView)();
 if(keep.size)el('main').querySelectorAll('details').forEach(d=>{if(keep.has(dKey(d)))d.open=true});
 if(openEx.size)el('main').querySelectorAll('.ex').forEach(e=>{if(openEx.has(e.id))e.classList.add('open')});
 lastView=vk;
 const inS=tab==='train'&&openSession&&findSess(openSession);
 try{document.body.classList.toggle('insess',!!inS)}catch(e){}
 const sb=el('sessbar');
 if(inS){sb.innerHTML=sessBarHTML(inS);sb.classList.remove('hide');updSessBar();holdWake()}else{sb.classList.add('hide');releaseWake()}
}
setInterval(()=>{try{if(openSession)updSessBar()}catch(e){}},20000);
render();
</script>
