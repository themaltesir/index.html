<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recomp43</title>
<style>
:root{--bg:#07090d;--card:#10151c;--card2:#161d27;--card3:#1d2632;--line:#222c39;--line2:#303d4f;--txt:#f2f5f9;--dim:#8b97a9;--acc:#38bdf8;--acc2:#0b2536;--accTxt:#03131d;--grad:linear-gradient(135deg,#38bdf8 0%,#2dd4bf 100%);--glow:rgba(56,189,248,.22);--grn:#4ade80;--grn2:#0e2619;--amb:#fbbf24;--red:#f87171;--pink:#f472b6;--pur:#a78bfa;--gold:#fcd34d;--r:18px;--sh:0 8px 24px rgba(0,0,0,.35)}
body.her{--acc:#f472b6;--acc2:#35122a;--accTxt:#2a0718;--grad:linear-gradient(135deg,#f472b6 0%,#c084fc 100%);--glow:rgba(244,114,182,.22)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:15.5px;line-height:1.5;padding-bottom:96px;min-height:100vh;background-image:radial-gradient(1000px 420px at 50% -180px,var(--glow),transparent 70%);background-repeat:no-repeat}
body.insess{padding-bottom:170px}
header{position:sticky;top:0;z-index:30;background:rgba(7,9,13,.8);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:19px;letter-spacing:1.6px;font-weight:900}

.sub{color:var(--dim);font-size:11.5px;margin-top:1px}
.pswitch{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.pswitch button{border:none;background:transparent;color:var(--dim);border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:800;min-height:36px}

.pswitch button.onher{background:linear-gradient(135deg,#f472b6,#c084fc);color:#2a0718}
main{padding:14px 16px 24px;max-width:640px;margin:0 auto}
.card{background:linear-gradient(180deg,var(--card) 0%,#0d1218 100%);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}

.card h3{font-size:13.5px;margin:10px 0 5px}

.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc)}
.big{font-size:24px;font-weight:900;letter-spacing:-.4px;line-height:1.15;margin:4px 0 8px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}

table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}

button{font-family:inherit;cursor:pointer}
.btn{background:var(--grad);color:var(--accTxt);border:none;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:800;width:100%;min-height:52px;box-shadow:0 8px 22px var(--glow),0 2px 6px rgba(0,0,0,.4);letter-spacing:.2px}
.btn:active,.btn2:active,.tick:active,.iconbtn:active{transform:scale(.97)}
.btn.pinkbg{background:linear-gradient(135deg,#f472b6,#c084fc);color:#2a0718}
.btn.grn{background:linear-gradient(135deg,#4ade80,#2dd4bf);color:#052e16}
.btn2{background:var(--card3);color:var(--txt);border:1px solid var(--line2);border-radius:12px;padding:10px 13px;font-size:13.5px;font-weight:600;min-height:42px}

nav{position:fixed;bottom:0;left:0;right:0;background:rgba(7,9,13,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;padding:5px 6px calc(5px + env(safe-area-inset-bottom));z-index:20;gap:3px}

.sessbar{position:fixed;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom));z-index:19;padding:9px 14px;background:rgba(10,13,18,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}

.sessbar .btn{width:auto;padding:10px 18px;min-height:46px;font-size:15px;flex:none}
.ex{background:var(--card2);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px;transition:border-color .3s}

.exhd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exbtns{display:flex;gap:6px;flex:none}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card3);border:1px solid var(--line2);color:var(--txt);font-size:16px;display:flex;align-items:center;justify-content:center}
.ex .name{font-weight:800;font-size:16.5px;margin-top:5px;letter-spacing:-.1px;line-height:1.25}
.ex .scheme{color:var(--grn);font-size:12.5px;margin:4px 0 2px;font-weight:600}
.ex .cue{color:var(--dim);font-size:12px}
.sugg{color:#c4b5fd;font-size:13px;margin-top:8px;font-weight:700;background:rgba(167,139,250,.12);border-radius:9px;padding:6px 9px;display:inline-block}
.last{color:var(--dim);font-size:11.5px;margin-top:4px}
.part{font-size:13.5px;font-weight:800;margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.part .pl{background:var(--card3);border:1px solid var(--line2);border-radius:7px;font-size:11px;padding:1px 7px;color:var(--acc)}
.info{margin-top:10px;padding:11px 12px;background:var(--card3);border:1px solid var(--line);border-radius:13px;font-size:13px}
.info p{margin-bottom:6px}
.sets{margin-top:8px}
.sethd,.setrow{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center}
.sethd{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:700;padding:2px 0}
.sethd span{text-align:center}
.setrow{margin:6px 0}
.setrow .sn{color:var(--dim);font-size:13px;font-weight:800;text-align:center}
.setrow input{text-align:center;padding:8px 4px;font-size:17px;font-weight:800;min-height:46px;font-variant-numeric:tabular-nums;transition:all .2s}

.setrow.done input{border-color:rgba(74,222,128,.55);background:var(--grn2);color:#dcfce7}
.tick{width:48px;height:46px;border-radius:13px;border:1.5px solid var(--line2);background:var(--card3);color:#5d6b80;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tick.on{background:var(--grn);border-color:var(--grn);color:#052e16;box-shadow:0 0 0 4px rgba(74,222,128,.16)}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{background:var(--card3);color:var(--txt);border:1px solid var(--line2);border-radius:11px;padding:10px;font-size:16px;width:100%;min-height:42px;font-family:inherit}
select{width:auto;font-size:14px;padding:8px 10px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
label{font-size:11.5px;color:var(--dim);display:block;margin:8px 0 4px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.7px;padding:3px 8px;border-radius:6px;text-transform:uppercase;display:inline-block}
.tag.main{background:#0f3550;color:#7dd3fc}
.tag.acc{background:#11301f;color:var(--grn)}
.tag.ss{background:#3a2c0f;color:var(--amb)}
.tag.iso{background:#3a1a2c;color:#f9a8d4}
.tag.core{background:#0d3330;color:#5eead4}
.tag.pwr{background:#3b300a;color:var(--gold)}
.banner{border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:13px;border:1px solid}
.banner.g{background:#0f2418;border-color:#1f4a33;color:var(--grn)}
.banner.a{background:#2a210d;border-color:#4d3d17;color:var(--amb)}
.banner.r{background:#2a1313;border-color:#4d2424;color:var(--red)}
.banner.n{background:#141b26;border-color:#283850;color:var(--dim)}
.timer{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;z-index:25;pointer-events:none}
body.insess .timer{bottom:calc(68px + env(safe-area-inset-bottom));text-align:left;padding-left:10px;right:auto}
body.insess .timer .box{font-size:21px;padding:5px 5px 5px 16px}
.timer .box{display:inline-flex;align-items:center;gap:6px;background:var(--grad);color:var(--accTxt);font-weight:900;font-size:24px;padding:7px 7px 7px 20px;border-radius:999px;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.timer .box span{min-width:62px;text-align:left;cursor:pointer}
.timer .box button{background:rgba(0,0,0,.2);border:none;color:var(--accTxt);font-weight:800;font-size:13px;border-radius:999px;padding:8px 12px;min-height:38px}
.timer.go .box{background:linear-gradient(135deg,#4ade80,#2dd4bf);color:#052e16}
.toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translate(-50%,-16px);opacity:0;background:#4ade80;color:#052e16;font-weight:800;padding:11px 18px;border-radius:999px;z-index:60;box-shadow:0 12px 32px rgba(0,0,0,.55);transition:all .25s;pointer-events:none;font-size:14px;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
details{margin-bottom:6px}
details.card{padding:6px 16px}
details.card[open]{padding-bottom:14px}
summary{cursor:pointer;font-weight:700;font-size:14px;padding:10px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:'›';color:var(--acc);font-size:22px;line-height:1;transform:rotate(90deg);transition:transform .15s;flex:none}
details[open]>summary::after{transform:rotate(-90deg)}
.hide{display:none!important}
ul,ol{padding-left:18px;margin-bottom:8px}
li{margin-bottom:4px}
.kpi{background:var(--card2);border-radius:12px;padding:10px 6px;text-align:center}
.kpi .v{font-size:17px;font-weight:800;color:var(--acc)}
.kpi .v.over{color:var(--red)}
.kpi .v.good{color:var(--grn)}
.kpi .k{font-size:10.5px;color:var(--dim)}
.bar{height:8px;background:var(--card3);border-radius:5px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:5px}
.bar i.over{background:var(--red)}
.ring{text-align:center}
.ring svg{width:100%;max-width:80px;height:auto}
.ring .rv{font-size:13px;font-weight:800;fill:var(--txt)}
.ring .rk{font-size:10.5px;color:var(--dim);line-height:1.25;margin-top:2px}
.fresult{padding:10px 6px;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;cursor:pointer;min-height:44px;align-items:center}
.fresult .m{color:var(--dim);font-size:11.5px}
.fentry{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl{border-left:2px solid var(--line2);padding-left:12px;margin-left:4px}
.tl div{margin-bottom:8px;font-size:13px}
.tl b{color:var(--acc);font-size:12.5px}
hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.wk .d{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px 0 6px;font-size:11.5px;font-weight:700;color:var(--dim)}
.wk .d.today{border-color:var(--acc);color:var(--txt);box-shadow:0 0 0 2px var(--acc2)}
.wk .d.fut{opacity:.55}
.wk .dots{display:flex;justify-content:center;gap:3px;margin-top:4px;height:8px}
.wk .dots i{width:8px;height:8px;border-radius:50%;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.vol{display:grid;grid-template-columns:84px 1fr 46px;gap:8px;align-items:center;font-size:12.5px;margin:7px 0}
.vol .trk{position:relative;height:11px;background:var(--card3);border-radius:6px;overflow:hidden}
.vol .zone{position:absolute;top:0;bottom:0;background:rgba(74,222,128,.12);border-left:1px dashed rgba(74,222,128,.55);border-right:1px dashed rgba(74,222,128,.55)}
.vol .plan{position:absolute;top:3px;bottom:3px;left:0;background:rgba(148,163,184,.32);border-radius:4px}
.vol .dn{position:absolute;top:0;bottom:0;left:0;background:var(--grad);border-radius:6px}

.qlist .qi:last-child{border-bottom:none}

.sesscard{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}

<body>
<header>
  <div><h1>RECOMP<span>43</span></h1><div class="sub" id="hdrSub2"></div></div>
  <div class="pswitch" id="pswitch"></div>
</header>
<main id="main"></main>
<div class="sessbar hide" id="sessbar"></div>
<div class="timer hide" id="timer"><div class="box"><span id="timerBox" onclick="stopTimer()">0:00</span><button onclick="addTime(30)">+30s</button><button onclick="stopTimer()">✕</button></div></div>
<div class="toast" id="toast"></div>
<nav id="nav"></nav>

<script>
const VERSION='5.0';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ============ STORAGE / PROFILE ============ */
const S={
 get(k,d){try{const v=localStorage.getItem('r43_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem('r43_'+k,JSON.stringify(v))}catch(e){}}
};
const todayKey=(d)=>{const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const dayName=k=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(k+'T12:00').getDay()];
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');
let tab=S.get('tab','today'), openSession=null, foodDate=todayKey(), foodQ='';
let prof=S.get('prof','me');
const P=()=>prof==='her'?'her_':'';
function setProf(p){prof=p;openSession=null;S.set('prof',p);render()}
function toggleTog(){S.set('tog',!S.get('tog',false));render()}

/* ============ SETTINGS ============ */
function cfg(){return S.get('cfg',{wt:86,wtHer:64,mode:'recomp',start:'',wake:'07:30',variety:'med'})}
function ensureStart(){
 const c=cfg();if(c.start)return;
 const h=S.get('hist',[]).concat(S.get('her_hist',[])).map(x=>x.d).sort();
 const d=new Date((h[0]||todayKey())+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7));
 c.start=todayKey(d);S.set('cfg',c);S.set('autoStart',c.start);
}
function setCfg(k,v){const c=cfg();c[k]=v;S.set('cfg',c);render()}
function myWt(){return prof==='her'?(cfg().wtHer||64):(cfg().wt||86)}
function progDays(){const c=cfg();if(!c.start)return 0;return Math.max(0,Math.floor((new Date(todayKey()+'T12:00')-new Date(c.start+'T12:00'))/864e5))}
function cycleNum(){const c=cfg();if(!c.start)return 1;return Math.floor(progDays()/84)+1}
function weekNum(){
 const c=cfg(); if(!c.start) return 1;
 return Math.min(12,Math.max(1,Math.floor((progDays()%84)/7)+1));
}
function curBlock(){const w=weekNum();return w<=4?'b1':w<=8?'b2':'b3'}
function blockNum(){return{b1:1,b2:2,b3:3}[curBlock()]}
function isConsol(){return weekNum()%4===0}

/* ============ PERIODISATION ============ */
/* rs = rest in seconds (drives the auto rest timer). pwr = explosive primer, core = abs. */
const BLOCKS={
 b1:{name:'Block 1 · Foundation',wks:'Wks 1–4',
  sch:{main:{sets:4,lo:8,hi:10,rir:2,rest:'2–3 min',rs:150,note:'3s lowering'},acc:{sets:3,lo:10,hi:12,rir:1,rest:'75–90s',rs:90,note:'controlled'},ss:{sets:3,lo:10,hi:15,rir:1,rest:'60s after pair',rs:60,note:''},iso:{sets:2,lo:12,hi:15,rir:1,rest:'45s',rs:45,note:''},
   core:{sets:3,lo:10,hi:15,rir:2,rest:'45s',rs:45,note:'breathe out hard, ribs down'},pwr:{sets:3,lo:3,hi:5,rir:null,rest:'60s',rs:60,note:'max speed, stop when speed drops'}},
  goal:'Technique, full range, slow lowering. Zone 2 on two non-lifting days.'},
 b2:{name:'Block 2 · Intensification',wks:'Wks 5–8',
  sch:{main:{sets:4,lo:6,hi:8,rir:2,rest:'2–3 min',rs:150,note:'drive up fast, exhale'},acc:{sets:3,lo:8,hi:10,rir:1,rest:'90s',rs:90,note:''},ss:{sets:3,lo:8,hi:12,rir:1,rest:'60s after pair',rs:60,note:''},iso:{sets:2,lo:10,hi:12,rir:0,rest:'45s',rs:45,note:'drop set on the last set'},
   core:{sets:3,lo:8,hi:12,rir:1,rest:'45–60s',rs:50,note:'add load once 12 feels easy'},pwr:{sets:3,lo:3,hi:5,rir:null,rest:'75s',rs:75,note:'heavier ball or higher box, same speed'}},
  goal:'Heavier (never below 6 reps), more rest. Add one 4×4 interval session a week.'},

/* ============ HEALTH METRICS / AUTO-READINESS (Brian's watch) ============ */
function mxKey(pfx){return (pfx??P())+'mx'}
function metrics(pfx){return S.get(mxKey(pfx),{})}
function saveMetric(dk,k,v,pfx){const m=metrics(pfx);m[dk]=m[dk]||{};if(v===''||isNaN(parseFloat(v)))delete m[dk][k];else m[dk][k]=parseFloat(v);S.set(mxKey(pfx),m)}
function baseline(key,excl){
 const m=metrics();const ks=Object.keys(m).filter(d=>d!==excl&&m[d][key]!=null).sort().slice(-14);
 if(ks.length<3)return null;
 const vals=ks.map(d=>m[d][key]).sort((a,b)=>a-b);
 return vals[Math.floor(vals.length/2)];
}
function readiness(){
 const dk=todayKey(),reasons=[];let flags=0,dataUsed=false;
 const mr=S.get(P()+'ready',null);
 if(mr&&mr.d===dk&&mr.s!=null&&mr.e!=null&&mr.m!=null){
  const sc=mr.s+mr.e+mr.m;
  return{st:sc>=5?'g':sc>=3?'a':'r',reasons:['Check-in: sleep '+['<6h','6–7h','7h+'][mr.s]+' · energy '+['flat','ok','good'][mr.e]+' · '+['rough','some','fresh'][mr.m]],manual:true};
 }
 {
  const m=metrics()[dk]||{};
  const bR=baseline('rhr',dk),bH=baseline('hrv',dk);
  if(m.rhr!=null&&bR!=null){dataUsed=true;if(m.rhr>=bR+5){flags++;reasons.push('RHR '+m.rhr+' vs '+bR+' baseline')}}
  if(m.hrv!=null&&bH!=null){dataUsed=true;if(m.hrv<=bH*0.8){flags++;reasons.push('HRV '+m.hrv+' vs '+bH)}}
  if(m.sleep!=null){dataUsed=true;if(m.sleep<6.5){flags++;reasons.push('Sleep '+m.sleep+'h')}}
  if(m.energy!=null){dataUsed=true;if(m.energy<=2){flags++;reasons.push('Energy '+m.energy+'/5')}}

 return RECIPES.map(r=>{

function weekDates(){const now=new Date(todayKey()+'T12:00'),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return todayKey(d)})}
function weekBudget(){
 const ds=weekDates(),tk=todayKey(),f=flog();
 let budget=0,used=0,usedAlc=0,toDate=0,missing=0;
 ds.forEach(dk=>{const day=f[dk]||{type:defType(dk),items:[]},t=targets(day.type).kcal;budget+=t;
  if(dk<=tk){toDate+=t;used+=day.items.reduce((a,it)=>a+(it.k||0),0);usedAlc+=day.items.filter(it=>it.a).reduce((a,it)=>a+(it.k||0),0);if(dk<tk&&!day.items.length)missing++}});
 const daysLeft=ds.filter(d=>d>tk).length;
 return{budget,used,usedAlc,toDate,missing,daysLeft,remaining:budget-used,perDay:daysLeft?Math.round((budget-used)/daysLeft):0};
}

 const rec=pts.filter(p=>p[0]>=0&&p[0]<=7).map(p=>p[1]),old=pts.filter(p=>p[0]>=14&&p[0]<=28).map(p=>p[1]);

 <details class="card" style="display:block"><summary>Nutrition basics — the rules that matter</summary>
 <h3>Protein anchoring</h3><p class="small">Build every meal around 30–50g protein first; everything else is negotiable. 4 feeds beats 2. Hardest habit, biggest payoff.</p>
 <h3>Fibre</h3><p class="small">25–35g/day (veg, fruit, oats, beans) — satiety, digestion, and it blunts the drinking-day damage.</p>
 <h3>80/20</h3><p class="small">If 80% of the week is on-plan, the 20% (wine, pastizzi, dessert) costs you nothing but time. Perfection isn’t the plan; the average is.</p>
 <h3>Eating out playbook</h3><p class="small">Order the grill section · protein double-up (add prawns/chicken) · sauce on the side · skip the bread basket, keep the wine if it’s a drink day · dessert shared or skipped.</p>
 <h3>Supermarket speed-list</h3><p class="small">Kwark/skyr · eggs · chicken thighs · 5% mince · tins of tuna · frozen veg + berries · oats · rice · olive oil · rice cakes · dark chocolate. That basket covers 90% of the week.</p>
 <h3>Belly fat — what actually shifts it</h3><p class="small">In order of impact: a weekly energy deficit (the budget card above) · alcohol, which adds energy and pauses fat burning while it is cleared · protein at every meal · fibre 30 g+ · 150+ minutes of aerobic work a week on top of lifting · 7+ hours of sleep. Crunches do not burn belly fat — the waist shrinks when total body fat does.</p></details>

 <details class="card" style="display:block"><summary>Timing, hydration, weekend rules, monthly adjustments</summary>
 <h3>Timing</h3><ul class="small"><li>Pre-gym 60–90 min: carbs + protein</li><li>Post: 40 g protein + carbs within ~2h</li><li>4 protein feeds/day beats 2</li><li>Friday: 50 g protein before first drink</li><li>Drinking bedtime: water + electrolytes + yoghurt</li></ul>
 <h3>Hydration</h3><p class="small">2.5–3 L floor, +500 ml training. Drinking: 1 water per 2 drinks, electrolytes at bed + waking.</p>
 <h3>Weekend design</h3><p class="small">Lifting lives Mon–Thu · Fri rest + protein dinner · Sat hangover-proof Engine · Sun 8k steps + early night.</p>
 <h3>Monthly rules</h3><table><tr><td>Waist ↓, weight flat</td><td>Perfect — change nothing</td></tr><tr><td>Weight & waist ↑ 2wks</td><td>−150 kcal Mon–Thu carbs</td></tr><tr><td>Weight ↓ >0.7 kg/wk or lifts drop</td><td>+150–200 kcal carbs</td></tr><tr><td>Stalled 3+ wks</td><td>The drinks are the honest place to look</td></tr></table>
 <h3>Getting properly cut</h3><p class="small">Visible definition ≈ 12–15% BF, abs 10–12%. Recomp + current weekends: leaner in 12 wks, cut in ~a year. Cut mode + weekends halved: cut in 16–20 wks. Hard cut + current weekends: mathematically cancels — not offered.</p></details>`;

function spark(key,label){
 const m=metrics();const ks=Object.keys(m).filter(d=>m[d][key]!=null).sort().slice(-14);
 if(ks.length<2)return'';
 const vs=ks.map(d=>m[d][key]);const mn=Math.min(...vs),mx=Math.max(...vs);
 const dir=vs[vs.length-1]-vs[0];
 return `<h3>${label} <span class="dim small">${vs[0]} → ${vs[vs.length-1]} (${dir>0?'+':''}${Math.round(dir*10)/10})</span></h3>
 <div style="display:flex;align-items:flex-end;gap:2px;height:34px;margin:3px 0 8px">${vs.map(v=>`<div style="flex:1;background:var(--acc);opacity:.75;border-radius:2px;height:${mx===mn?55:Math.round(18+82*(v-mn)/(mx-mn))}%"></div>`).join('')}</div>`;
}
function importCSV(){
 const lines=el('csvBox').value.split('\n');let n=0;
 lines.forEach(L=>{
  const p=L.trim().split(',');
  if(p.length>=2&&/^\d{4}-\d{2}-\d{2}/.test(p[0])){
   const dk=p[0].slice(0,10);
   if(p[1])saveMetric(dk,'rhr',p[1]);if(p[2])saveMetric(dk,'hrv',p[2]);if(p[3])saveMetric(dk,'sleep',p[3]);n++;
  }});
 el('csvMsg').textContent=n+' days imported';setTimeout(render,600);
}

function plates(){
 const t=parseFloat(el('plT').value)||0,bar=parseFloat(el('plB').value)||20;
 let per=(t-bar)/2;
 if(t<=0){el('plOut').textContent='';return}
 if(per<0){el('plOut').textContent='Below bar weight';return}
 const out=[];[25,20,15,10,5,2.5,1.25].forEach(p=>{while(per>=p-1e-9){out.push(p);per-=p}});
 el('plOut').textContent=out.length?out.join(' + ')+' kg per side'+(per>0.01?' (+'+per.toFixed(2)+' short)':''):'Empty bar';
}
/* ---- TIMER (auto-starts after each ticked set) ---- */
let tInt=null,tEnd=0,tHide=null,aCtx=null;
function unlockAudio(){try{if(!aCtx)aCtx=new (window.AudioContext||window.webkitAudioContext)();if(aCtx.state==='suspended')aCtx.resume()}catch(e){}}
function tTick(){
 const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
 el('timerBox').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 if(left<=0){clearInterval(tInt);el('timerBox').textContent='GO';el('timer').classList.add('go');beep();tHide=setTimeout(()=>el('timer').classList.add('hide'),3500)}
}
function startTimer(sec){clearInterval(tInt);clearTimeout(tHide);el('timer').classList.remove('hide','go');tEnd=Date.now()+sec*1000;tTick();tInt=setInterval(tTick,250)}
function addTime(s){const left=Math.max(0,tEnd-Date.now());startTimer(Math.round(left/1000)+s)}
function stopTimer(){clearInterval(tInt);clearTimeout(tHide);const t=el('timer');if(t)t.classList.add('hide')}
function beep(){
 try{unlockAudio();const c=aCtx;if(c)[0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.3,c.currentTime+t);o.start(c.currentTime+t);o.stop(c.currentTime+t+.16)})}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
/* Keep the screen awake during a workout (Safari 16.4+) */
let wakeLock=null;
async function holdWake(){try{if(navigator.wakeLock&&!wakeLock&&!document.hidden){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}
function releaseWake(){try{if(wakeLock)wakeLock.release()}catch(e){}wakeLock=null}

 const src=(location.search&&location.search.length>1)?location.search:(location.hash&&location.hash.indexOf('=')>-1?'?'+location.hash.slice(1):'');
 if(!src)return;

 }

 [['rhr',30,120],['hrv',5,250],['sleep',0,16],['energy',1,5],['wt',40,200],['waist',50,200],['steps',0,100000],['vo2',10,80],['move',0,4000],['exmin',0,600],['stand',0,24]].forEach(([k,lo,hi])=>{
  const v=parseFloat(q.get(k));
  if(!isNaN(v)&&v>=lo&&v<=hi){saveMetric(dk,k,String(Math.round(v*10)/10),'');got.push(k.toUpperCase()+' '+(Math.round(v*10)/10))}
 });
 if(got.length){S.set('lastSync',dk+' — '+got.join(' · '));tab='today';S.set('tab','today');prof='me';S.set('prof','me');
  try{history.replaceState(null,'',location.pathname)}catch(e){}}
}catch(e){}})();

/* Ask iOS/browser to protect localStorage from eviction */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
/* Stale-tab guard: any old Safari tab re-reads storage the moment it's viewed again */
try{
 window.addEventListener('pageshow',()=>render());
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
 window.addEventListener('storage',()=>render());
