ul,ol{padding-left:18px;margin-bottom:8px}

<body>
<header>
  <div><h1>RECOMP<span>43</span></h1><div class="sub" id="hdrSub2"></div></div>
  <div class="pswitch" id="pswitch"></div>
</header>
<main id="main"></main>
<div class="sessbar hide" id="sessbar"></div>
<div class="timer hide" id="timer"><div class="box"><span id="timerBox" onclick="stopTimer()">0:00</span><button onclick="addTime(30)">+30s</button><button onclick="stopTimer()">✕</button></div></div>
<div class="toast" id="toast"></div>
<nav id="nav"></nav>
<script>
const VERSION='6.0';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ============ STORAGE / PROFILE ============ */
const S={
 get(k,d){try{const v=localStorage.getItem('r43_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem('r43_'+k,JSON.stringify(v))}catch(e){}}
};
const todayKey=(d)=>{const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const dayName=k=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(k+'T12:00').getDay()];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=k=>dayName(k)+' '+(+k.slice(8))+' '+MONTHS[+k.slice(5,7)-1];
const addDays=(k,n)=>{const d=new Date(k+'T12:00');d.setDate(d.getDate()+n);return todayKey(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');
let tab=S.get('tab','today'), openSession=null, foodDate=todayKey(), foodQ='';

/* ============ TIME OFF — holidays, sickness, busy weeks ============
   {id,from,to,type:'holiday'|'sick'|'busy',who:'both'|'me'|'her',gym:bool}
   Shared ('both') time off pauses the programme clock, so blocks resume where they stopped. */
const OFFTYPES={holiday:{ic:'✈️',n:'Holiday'},sick:{ic:'🤒',n:'Ill'},busy:{ic:'💼',n:'Busy / work trip'}};
function offList(){return S.get('off',[])}
function offOn(dk,pfx){const w=(pfx??P())==='her_'?'her':'me',m=offList().filter(o=>dk>=o.from&&dk<=o.to&&(o.who==='both'||o.who===w));return m.find(o=>o.type==='sick')||m.find(o=>o.who!=='both')||m[0]||null}
function offNext(pfx,within){const w=(pfx??P())==='her_'?'her':'me',tk=todayKey();return offList().filter(o=>o.from>tk&&daysBetween(tk,o.from)<=(within||14)&&(o.who==='both'||o.who===w)).sort((a,b)=>a.from<b.from?-1:1)[0]||null}
function offDaySet(){return memo('offset',()=>{const s=new Set();offList().filter(o=>o.who==='both').forEach(o=>{let d=o.from,g=0;while(d<=o.to&&g++<400){s.add(d);d=addDays(d,1)}});return s})}
function pausedDays(from,to){let n=0;offDaySet().forEach(d=>{if(d>=from&&d<to)n++});return n}
function progDays(dk){const c=cfg();if(!c.start)return 0;dk=dk||todayKey();return Math.max(0,daysBetween(c.start,dk)-pausedDays(c.start,dk))}
function progDateOf(idx){/* first calendar date whose programme day = idx */
 return memo('pdo'+idx,()=>{const c=cfg();if(!c.start)return todayKey();const off=offDaySet();let d=c.start,n=0,g=0;while(n<idx&&g++<5000){if(!off.has(d))n++;d=addDays(d,1)}return d});
}
function cycleNum(dk){const c=cfg();if(!c.start)return 1;return Math.floor(progDays(dk)/84)+1}
function weekNum(dk){const c=cfg();if(!c.start)return 1;return Math.min(12,Math.max(1,Math.floor((progDays(dk)%84)/7)+1))}
function curBlock(dk){const w=weekNum(dk);return w<=4?'b1':w<=8?'b2':'b3'}
function blockNum(dk){return{b1:1,b2:2,b3:3}[curBlock(dk)]}
function isConsol(dk){return weekNum(dk)%4===0}
function blockStart(){return progDateOf((cycleNum()-1)*84+(blockNum()-1)*28)}

 <div style="margin-top:10px"><button class="btn2" onclick="addOff()">+ Add time off</button></div></div>`;

function backupText(){
 const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('r43_'))out[k]=localStorage.getItem(k)}
 return JSON.stringify(out);
}
function doBackup(){el('bkBox').value=backupText();el('bkBox').select();S.set('lastBk',todayKey());try{document.execCommand('copy');el('bkMsg').textContent='Copied — paste somewhere safe (Notes)'}catch(e){el('bkMsg').textContent='Select-all and copy manually'}}

/* ---- TIMER (auto-starts after each ticked set) ---- */
let tInt=null,tEnd=0,tHide=null,aCtx=null;
function unlockAudio(){try{if(!aCtx)aCtx=new (window.AudioContext||window.webkitAudioContext)();if(aCtx.state==='suspended')aCtx.resume()}catch(e){}}
function tTick(){
 const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
 el('timerBox').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 if(left<=0){clearInterval(tInt);el('timerBox').textContent='GO';el('timer').classList.add('go');beep();tHide=setTimeout(()=>el('timer').classList.add('hide'),3500)}
}
function startTimer(sec){clearInterval(tInt);clearTimeout(tHide);el('timer').classList.remove('hide','go');tEnd=Date.now()+sec*1000;tTick();tInt=setInterval(tTick,250)}
function addTime(s){const left=Math.max(0,tEnd-Date.now());startTimer(Math.round(left/1000)+s)}
function stopTimer(){clearInterval(tInt);clearTimeout(tHide);const t=el('timer');if(t)t.classList.add('hide')}
function beep(){
 try{unlockAudio();const c=aCtx;if(c)[0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.3,c.currentTime+t);o.start(c.currentTime+t);o.stop(c.currentTime+t+.16)})}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
/* Keep the screen awake during a workout (Safari 16.4+) */
let wakeLock=null;
async function holdWake(){try{if(navigator.wakeLock&&!wakeLock&&!document.hidden){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}
function releaseWake(){try{if(wakeLock)wakeLock.release()}catch(e){}wakeLock=null}

/* ---- URL SYNC (iOS Shortcut) ---- */
(function(){try{
 const src=(location.search&&location.search.length>1)?location.search:(location.hash&&location.hash.indexOf('=')>-1?'?'+location.hash.slice(1):'');
 if(!src)return;
 const q=new URLSearchParams(src);
 if(q.get('test')){
  S.set('lastSync','Test ping '+todayKey()+' — the link into the app works ✓ (now check the shortcut/automation)');
  tab='data';S.set('tab','data');
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  return;
 }
 /* p=clare (or her) files the numbers under Clare; anything else goes to Brian */
 const who=(q.get('p')||q.get('who')||'').toLowerCase(),pfx=/^(clare|her|c)$/.test(who)?'her_':'';
 const dk=(q.get('d')||todayKey()).slice(0,10);let got=[];
 [['rhr',30,120],['hrv',5,250],['sleep',1,16],['energy',1,5],['wt',30,200],['waist',40,200],['steps',0,100000],['vo2',10,80],['move',0,4000],['exmin',0,600],['stand',0,24]].forEach(([k,lo,hi])=>{
  const v=parseFloat(q.get(k));
  if(!isNaN(v)&&v>=lo&&v<=hi){saveMetric(dk,k,String(Math.round(v*10)/10),pfx);got.push(k.toUpperCase()+' '+(Math.round(v*10)/10))}
 });
 if(got.length){S.set(pfx?'lastSyncHer':'lastSync',dk+' — '+got.join(' · '));tab='today';S.set('tab','today');prof=pfx?'her':'me';S.set('prof',prof);
  try{history.replaceState(null,'',location.pathname)}catch(e){}}
}catch(e){}})();

/* Ask iOS/browser to protect localStorage from eviction */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
/* Stale-tab guard: any old Safari tab re-reads storage the moment it's viewed again */
try{
 window.addEventListener('pageshow',()=>render());
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
 window.addEventListener('storage',()=>render());
}catch(e){}

 lastView=vk;

 if(inS){sb.innerHTML=sessBarHTML(inS);sb.classList.remove('hide');updSessBar();holdWake()}else{sb.classList.add('hide');releaseWake()}
}

render();
